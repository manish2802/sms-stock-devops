apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-service
  namespace: stock-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-service
  template:
    metadata:
      labels:
        app: stock-service
    spec:
      containers:
      - name: stock-service
        image: manish28/stockservice:latest
        ports:
        - containerPort: 9001
        envFrom:
        - configMapRef:
            name: stock-service-config
        - secretRef:
            name: stock-service-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9001
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9001
          initialDelaySeconds: 60
          periodSeconds: 20